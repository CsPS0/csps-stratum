# Starship Minimalist OLED Monochrome Configuration

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$character"""

add_newline = false

[character]
success_symbol = "[❯](bold white)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold white"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "󰊢 "
style = "bold bright-black"

[git_status]
style = "bold bright-black"

[username]
style_user = "bold white"
style_root = "bold red"
format = "[$user]($style)@"
show_always = false
