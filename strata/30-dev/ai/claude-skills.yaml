# Claude Code Skills & Plugins Catalog
assistant:
  name: "Claude Code"
  config_path: "~/.claude"

installed_skills:
  - name: "one-skill-to-rule-them-all"
    path: "~/.claude/skills/one-skill-to-rule-them-all"
    role: "Background watcher capturing repetitive multi-step actions into reusable skills"
  - name: "graphify"
    path: "~/.claude/skills/graphify"
    role: "Whole-repository knowledge graph builder and visual architecture mapper"
  - name: "humanizer"
    path: "~/.claude/skills/humanizer"
    role: "Refines player/user-facing text to read naturally without robotic phrasing"

enabled_plugins:
  planning_and_workflow:
    - name: "superpowers"
      role: "Brainstorming, structured plan creation, subagent dispatch, test-driven dev"
    - name: "claude-mem"
      role: "Cross-session memory search, project timeline reports, and design audits"
    - name: "deep-project / deep-plan / deep-implement"
      role: "Decomposition of complex epics into verifiable milestones"
    - name: "feature-dev"
      role: "Guided feature discovery with code-explorer, code-architect, and code-reviewer agents"

  code_intelligence_and_editing:
    - name: "serena"
      role: "Semantic code analysis, symbol-level replacement, and definition lookups"
    - name: "context7"
      role: "Up-to-date, versioned library and framework documentation queries"
    - name: "ponytail"
      role: "Concise, bloat-free code style enforcement and shortcut auditing"
    - name: "code-simplifier"
      role: "Tidies working tree diffs without altering program behavior"

  verification_and_git:
    - name: "commit-commands"
      role: "Structured commits ensuring clean messages with all AI attribution trailers stripped"
    - name: "security-guidance / claude-security"
      role: "Vulnerability analysis and credential checks before sharing code"

  language_servers_lsp:
    - "typescript-lsp"
    - "pyright-lsp"
    - "csharp-lsp"
    - "php-lsp"
