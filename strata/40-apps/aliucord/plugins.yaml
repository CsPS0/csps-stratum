# Aliucord (Discord Android Client Mod) Plugins Manifest
# Corresponds to desktop Vencord plugins configured in strata/40-apps/vencord

theme:
  name: "rain"
  file: "rain.json"
  base: "Dracula Dark / DMSans"
  author: "lampdelivery"

plugins:
  - id: "1ClickDelete"
    description: "Instant message deletion button in context menu"
  - id: "AlwaysAnimate"
    description: "Always animates avatars and emojis without hovering"
  - id: "BetterSilentTyping"
    vencord_equivalent: "SilentTyping"
    description: "Prevents sending typing events to guilds and DMs"
  - id: "CallTime"
    vencord_equivalent: "CallTimer"
    description: "Displays elapsed duration in voice and video calls"
  - id: "DedicatedPluginSettings"
    description: "Dedicated submenus for individual plugin configurations"
  - id: "FakeStickers"
    description: "Send Nitro custom stickers without active Nitro subscription"
  - id: "FolderOpacity"
    description: "Custom opacity controls for server folders"
  - id: "FullBio"
    description: "Displays complete user biographies without truncation"
  - id: "MoreSlashCommands"
    description: "Extended slash command integrations"
  - id: "Moyai"
    description: "Custom emoji shortcuts and stone face reactions"
  - id: "NewEmojis"
    description: "Support for latest Unicode emoji sets"
  - id: "NitroSpoof"
    vencord_equivalent: "FakeNitro"
    description: "Send custom emojis from any server as direct links"
  - id: "PluginRepo"
    description: "Integrated in-app repository browser for Aliucord plugins"
  - id: "ReadAllButton"
    vencord_equivalent: "ReadAllNotificationsButton"
    description: "Single-tap button to mark all notifications as read"
  - id: "RemoveZoomLimit"
    description: "Uncapped image zooming in preview modal"
  - id: "ShowHiddenChannels"
    vencord_equivalent: "ShowHiddenChannels"
    description: "Renders locked or restricted channels in the channel list"
  - id: "SplitMessages"
    description: "Splits messages exceeding the 2000 character limit"
  - id: "ThemeRepo"
    description: "Integrated in-app theme repository browser"
  - id: "Themer"
    description: "Core CSS/JSON theming engine applying rain.json"
