# Multi-Store & Alternative Game Launchers
launchers:
  heroic:
    name: "Heroic Games Launcher (Epic Games / GOG Client)"
    package: "HeroicGamesLauncher.HeroicGamesLauncher"
    installed_games:
      - name: "Fortnite"
        store: "Epic Games"

  hoyoverse:
    name: "HoYoPlay Launcher"
    installed_games:
      - name: "Genshin Impact"
        developer: "miHoYo"

  # Minecraft mod list and migration notes: strata/40-apps/minecraft
  horizon:
    name: "Horizon Launcher (Rust reimplementation of Minecraft: Java Edition)"
    install_dir: '%LOCALAPPDATA%\Programs\Horizon Launcher'
    game_dir: '%APPDATA%\horizon'

  minecraft:
    name: "Prism Launcher"
    package: "PrismLauncher.PrismLauncher"
    instance: "Fabric - Heavily Modded (26.3, Fabric 0.20.1)"
    runtimes:
      - "Java 25 (Microsoft OpenJDK)"

  xbox:
    name: "Xbox App & Microsoft Gaming Services"
    ecosystem: "PC Game Pass / Microsoft Store"

  ubisoft:
    name: "Ubisoft Connect"
    package: "Ubisoft.Connect"

  roblox:
    name: "Roblox Player"
    package: "Roblox.Roblox"
