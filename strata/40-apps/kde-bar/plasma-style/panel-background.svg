<?xml version="1.0" encoding="UTF-8"?>
<!-- Panel background for the OLED-Monochrome Plasma style: opaque black, 10 px corners and a 1 px
     #2A2B2D border, like the Windows YASB bar and dock. A Plasma frame SVG: nine pieces (corners,
     edges, centre), the same nine as a mask (mask-*), and margin hints for the panel content. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="30" viewBox="0 0 100 30">
  <!-- Frame. Each corner is 10x10: a #2A2B2D quarter disc with a black radius-9 one inside. -->
  <g id="topleft">
    <path d="M10,10 L0,10 A10,10 0 0 1 10,0 Z" fill="#2A2B2D"/>
    <path d="M10,10 L1,10 A9,9 0 0 1 10,1 Z" fill="#000000"/>
  </g>
  <g id="topright">
    <path d="M20,10 L20,0 A10,10 0 0 1 30,10 Z" fill="#2A2B2D"/>
    <path d="M20,10 L20,1 A9,9 0 0 1 29,10 Z" fill="#000000"/>
  </g>
  <g id="bottomright">
    <path d="M20,20 L30,20 A10,10 0 0 1 20,30 Z" fill="#2A2B2D"/>
    <path d="M20,20 L29,20 A9,9 0 0 1 20,29 Z" fill="#000000"/>
  </g>
  <g id="bottomleft">
    <path d="M10,20 L10,30 A10,10 0 0 1 0,20 Z" fill="#2A2B2D"/>
    <path d="M10,20 L10,29 A9,9 0 0 1 1,20 Z" fill="#000000"/>
  </g>
  <g id="top"><rect x="10" y="0" width="10" height="1" fill="#2A2B2D"/><rect x="10" y="1" width="10" height="9" fill="#000000"/></g>
  <g id="bottom"><rect x="10" y="20" width="10" height="9" fill="#000000"/><rect x="10" y="29" width="10" height="1" fill="#2A2B2D"/></g>
  <g id="left"><rect x="0" y="10" width="1" height="10" fill="#2A2B2D"/><rect x="1" y="10" width="9" height="10" fill="#000000"/></g>
  <g id="right"><rect x="20" y="10" width="9" height="10" fill="#000000"/><rect x="29" y="10" width="1" height="10" fill="#2A2B2D"/></g>
  <rect id="center" x="10" y="10" width="10" height="10" fill="#000000"/>

  <!-- Mask: the same shape, opaque (used for blur and the input region). -->
  <path id="mask-topleft" d="M50,10 L40,10 A10,10 0 0 1 50,0 Z"/>
  <path id="mask-topright" d="M60,10 L60,0 A10,10 0 0 1 70,10 Z"/>
  <path id="mask-bottomright" d="M60,20 L70,20 A10,10 0 0 1 60,30 Z"/>
  <path id="mask-bottomleft" d="M50,20 L50,30 A10,10 0 0 1 40,20 Z"/>
  <rect id="mask-top" x="50" y="0" width="10" height="10"/>
  <rect id="mask-bottom" x="50" y="20" width="10" height="10"/>
  <rect id="mask-left" x="40" y="10" width="10" height="10"/>
  <rect id="mask-right" x="60" y="10" width="10" height="10"/>
  <rect id="mask-center" x="50" y="10" width="10" height="10"/>

  <!-- Content margins: 3 px above and below, 8 px at the ends (the corners alone would take 10). -->
  <rect id="hint-top-margin" x="80" y="0" width="1" height="3" fill="#ff00ff"/>
  <rect id="hint-bottom-margin" x="82" y="0" width="1" height="3" fill="#ff00ff"/>
  <rect id="hint-left-margin" x="84" y="0" width="8" height="1" fill="#ff00ff"/>
  <rect id="hint-right-margin" x="84" y="2" width="8" height="1" fill="#ff00ff"/>
</svg>
