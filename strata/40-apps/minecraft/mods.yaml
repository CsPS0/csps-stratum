# Horizon (Rust client). Java mods don't run here: `mods check` only ports a mod's
# textures and data, and every mod above is client code. These are the closest
# native replacements, set up 2026-11-21.
horizon:
  native_mods:
    # Compiled into the game with Horizon's Rust toolchain (installed 2026-11-21, `rust install`).
    # Both are pinned to Horizon commit 0b14f8a, which isn't a downloadable release, so
    # `native-build` leaves them out. They stay installed and enabled; run
    # `mods update` then `native-build --trust-native-code` once their authors update them.
    - { name: "Minimap, Worldmap and waypoints reworked", id: "minimap_worldmap_waypoints_reworked", version: "0.7.0", replaces: ["Xaero's Minimap", "Xaero's World Map"], status: "waiting for an update" }
    - { name: "Universal Viewer", id: "universal_viewer", version: "0.1.13", replaces: ["Shulker Box Tooltip"], status: "waiting for an update" }
  builtin_extras:
    # %APPDATA%\horizon\horizon-extras.txt
    zoom: { enabled: true, key: "C", replaces: "Zoomify" }
    dynamicLights: { enabled: true, replaces: "LambDynamicLights" }
    minimap: { enabled: true, replaces: "Xaero's Minimap", note: "turn off once the native minimap mod builds" }
    entity_culling: { replaces: "EntityCulling", note: "always on in horizon-graphics.txt" }
  resource_packs_enabled:
    - "Even Better Enchants"
    - "Invisible Item Frames"
    - "Silent Portals"
    - "Vanilla Connected Glass"
    - "No Villager Idle Sounds"
    - "Enhanced Boss Bars"
  resource_packs_off:
    - { name: "Fresh Animations (+ Extensions)", reason: "needs EMF/ETF, which Horizon can't run" }
    - { name: "Fullbright UB", reason: "Horizon has a built-in fullbright" }
    - { name: "Bare Bones", reason: "full texture overhaul that was never active in Java" }
  shader: "Complementary Shaders - Unbound"
  no_equivalent:
    - "Mouse Tweaks"
    - "Status Effect Bars"
    - "Pick Up Notifier"
    - "Chat Heads"
    - "Fadeless"
    - "Particle Tweaks"
    - "Boat Item View"
    - "Stendhal"
    - "Fabrishot"
    - "Simple Voice Chat"
    - "Searchables / Controlling"
