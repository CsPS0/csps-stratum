# Minecraft Mods, Resource Packs & Shaders
# Source of truth: Prism Launcher instance "Fabric - Heavily Modded"
#   %APPDATA%\PrismLauncher\instances\Fabric - Heavily Modded\minecraft
# IDs are Modrinth project IDs unless `source` says otherwise
# (https://modrinth.com/project/<id>).
#
# horizon_builtin: Horizon (Rust client) has its own version of this feature,
#                  so the mod isn't needed in the Horizon instance.
# horizon:         result of `horizon-launcher.exe mods check <id>` (fill in once checked).
# disabled:        jar renamed to .jar.disabled in Prism because it has no 26.3 build (2026-11-21).
# pinned:          held back on purpose; don't let Prism update it until the reason is gone.

instance:
  name: "Fabric - Heavily Modded"
  launcher: "Prism Launcher"
  minecraft: "26.3"
  loader: "fabric"
  loader_version: "0.20.1"
  java: "25 (Microsoft OpenJDK)"

