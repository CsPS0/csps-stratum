# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Monochrome top bar, laid out like the KDE laptop's top panel and the macOS menu bar:
# app name and the rest of menubar.exe's strip on the left, date/time and next event in the exact
# centre (centre-bar), the rest on the right. Both screens get the same two bars.
# The bars float: 6 px from the screen's top and sides, 32 px tall, rounded (styles.css), and the
# 6 px below them is reserved too, so maximised windows keep a gap. menubar.cpp has the same numbers.
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  top-bar:
    enabled: true
    screens: ['*']
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: false
    blur_effect:
      enabled: false
    window_flags:
      always_on_top: true   # stays over a full-screen app left behind another window (a game behind Claude)
      windows_app_bar: true
      hide_on_fullscreen: true   # and gets out of the way while that app is focused
    dimensions:
      width: 100%
      height: 32
    padding:
      top: 6
      left: 6
      bottom: 6
      right: 6
    layouts:
      # the left section's widgets (CPU, RAM, GPU, weather) start at a fixed 380 px from the screen's
      # left edge (margin in styles.css); menubar.exe's strip ends just before ([bar] stats_x)
      left:
        alignment: left
        stretch: true
    widgets:
      # left end is drawn by menubar.exe: app name, desktop dots (2+ desktops), what's playing with
      # its visualizer; see menubar\
      left:
      - cpu
      - memory
      - gpu
      - weather
      center: []   # the date/time and next event live in centre-bar, pinned to the exact middle
      right:
      - claude_usage
      - antigravity_usage
      - systray
      - language
      - microphone
      - volume
      - notifications
      - power
  centre-bar:
    # YASB centres the middle section only within its share of the bar, and the right side is much
    # wider than the left, so the clock sat left of centre. This bar is centred on the screen itself
    # and only as wide as the clock and event, so the main bar's right side can use the rest (a fixed
    # 560 px covered the start of the Claude usage once the tray grew). Not an app bar (the main bar
    # already reserves the space), kept above it, and drawn inside the main bar's 1 px outline.
    enabled: true
    screens: ['*']
    class_name: centre-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: false
    blur_effect:
      enabled: false
    window_flags:
      always_on_top: true
      windows_app_bar: false
      hide_on_fullscreen: true
    dimensions:
      width: auto
      height: 30
    padding:
      top: 7
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: []
      center:
      - clock
      - calendar_event
      - quick_apps
      right: []
widgets:
  calendar_event:
    # Next Google Calendar event (calendar\next-event.py). Reads the private iCal link(s) from
    # calendar-url.txt in this folder; hidden while that file is missing or nothing is coming up.
    type: yasb.custom.CustomWidget
    options:
      label: '{data[text]}'
      label_alt: '{data[text]}'
      label_placeholder: ''
      class_name: calendar-event-widget
      tooltip: true
      tooltip_label: '{data[tooltip]}'
      exec_options:
        run_cmd: 'pythonw -I "%USERPROFILE%\.config\yasb\calendar\next-event.py"'
        run_interval: 300000
        return_format: json
        hide_empty: true
        use_shell: true
      callbacks:
        on_left: 'exec cmd /c start https://calendar.google.com'
        on_middle: exec_custom
        on_right: do_nothing
  claude_usage:
    # Claude plan used in the 5-hour window, from ai-usage\ai_usage.py; click for every limit (ai-usage\popup.py).
    # Hidden while neither Claude Code nor the Claude app runs. YASB's own ClaudeUsageWidget can't hide.
    type: yasb.custom.CustomWidget
    options:
      label: '{data}'
      label_alt: '{data}'
      label_placeholder: ''
      class_name: claude-usage-widget
      tooltip: false
      exec_options:
        # Plain text, not json: with json, an empty result breaks YASB's '{data[...]}' formatting
        # before hide_empty is checked, so the raw template showed instead of the widget hiding.
        run_cmd: 'pythonw -I "%USERPROFILE%\.config\yasb\ai-usage\ai_usage.py" claude --text'
        run_interval: 60000
        return_format: string
        hide_empty: true
        use_shell: true
      callbacks:
        on_left: "exec pythonw -I -c __import__('runpy').run_path(__import__('os').path.expanduser('~/.config/yasb/ai-usage/popup.py'),run_name='__main__') claude"
        on_middle: do_nothing
        on_right: do_nothing
  antigravity_usage:
    # Most-used Antigravity model quota; click for every model and reset time. Hidden while Antigravity is closed
    type: yasb.custom.CustomWidget
    options:
      label: '{data}'
      label_alt: '{data}'
      label_placeholder: ''
      class_name: claude-usage-widget
      tooltip: false
      exec_options:
        run_cmd: 'pythonw -I "%USERPROFILE%\.config\yasb\ai-usage\ai_usage.py" antigravity --text'
        run_interval: 60000
        return_format: string
        hide_empty: true
        use_shell: true
      callbacks:
        on_left: "exec pythonw -I -c __import__('runpy').run_path(__import__('os').path.expanduser('~/.config/yasb/ai-usage/popup.py'),run_name='__main__') antigravity"
        on_middle: do_nothing
        on_right: do_nothing
  language:
    # keyboard layout; click to switch
    type: yasb.language.LanguageWidget
    options:
      label: '{lang[language_code]}'
      label_alt: '{lang[full_name]}'
      update_interval: 5
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
      language_menu:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: right
        direction: down
        offset_top: 6
        offset_left: 0
        show_layout_icon: true
  microphone:
    # click: mute; scroll: level; middle-click: device menu
    type: yasb.microphone.MicrophoneWidget
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {level}"
      mute_text: mute
      tooltip: true
      icons:
        normal: ""
        muted: ""
      mic_menu:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: right
        direction: down
      callbacks:
        on_left: toggle_mute
        on_middle: toggle_mic_menu
        on_right: toggle_label
  systray:
    type: yasb.systray.SystrayWidget
    options:
      class_name: systray
      label_collapsed: "\uE70D"
      label_expanded: "\uE70E"
      label_position: left
      icon_size: 16
      show_unpinned: true          # every tray icon always visible in the bar
      show_unpinned_button: false  # no arrow
      show_in_popup: false
      icons_per_row: 6
      popup:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: right
        direction: down
        offset_top: 6
        offset_left: 0
      show_battery: false
      show_volume: false
      show_network: true
      tooltip: true
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%Y-%m-%d  %H:%M}<span>{alarm}</span>'
      label_alt: '{%Y-%m-%d, %A  %H:%M:%S}'
      timezones: []
      calendar:
        blur: false
        round_corners: true
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: toggle_label
        on_right: context_menu
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: <span>{icon}</span>
      label_alt: <span>{icon}</span>{level}
      tooltip: true
      icons:
        muted: ""
        '10': ""
        '30': ""
        '60': ""
        '100': ""
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: ""
          toggle_up: ""
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span></span>"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  cpu:
    # click: small popup with a 2-minute graph, usage, frequency and cores; right-click: frequency
    type: yasb.cpu.CpuWidget
    options:
      label: "CPU {info[percent][total]}%"
      label_alt: "CPU {info[freq][current]:.0f} MHz"
      update_interval: 2000
      hide_decimal: true
      menu: &stats_menu
        enabled: true
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: center
        direction: down
        offset_top: 6
        graph_history_size: 60
        show_graph: true
        show_graph_grid: false
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
  memory:
    # click: popup with graph, used / free / committed; right-click: used of total
    type: yasb.memory.MemoryWidget
    options:
      label: "RAM {virtual_mem_percent}%"
      label_alt: "RAM {virtual_mem_used}/{virtual_mem_total}"
      update_interval: 2000
      hide_decimal: true
      menu: *stats_menu
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
  gpu:
    # NVIDIA (NVML) load; click: popup with load and temperature graphs, VRAM; right-click: VRAM
    type: yasb.gpu.GpuWidget
    options:
      label: "GPU {info[utilization]}%"
      label_alt: "GPU {info[mem_used]}/{info[mem_total]}"
      update_interval: 2000
      hide_decimal: true
      menu: *stats_menu
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
  weather:
    # Open-Meteo (free, no account). The first click asks for your city (search in the popup); it's
    # saved by YASB in its own weather.json, not in this repo. Click: forecast card.
    type: yasb.open_meteo.OpenMeteoWidget
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "{location} {temp}"
      update_interval: 1800
      hide_decimal: true
      units: metric
      forecast_days: 5
      tooltip: true
      weather_card:
        # compact: small icons, 5 days, no hourly strip (it drew see-through and cut off its icons)
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: center
        direction: down
        offset_top: 6
        icon_size: 32
        show_hourly_forecast: false
        time_format: 24h
      callbacks:   # without these a click does nothing (YASB's default), so setup can't open
        on_left: toggle_card
        on_middle: do_nothing
        on_right: toggle_label
  quick_apps:
    # Icon buttons next to the clock: File Explorer, WezTerm, Task Manager, Settings
    type: yasb.applications.ApplicationsWidget
    options:
      label: "{data}"
      class_name: quick-apps
      tooltip: true
      app_list:
      - { icon: "", launch: "explorer.exe", name: "File Explorer" }
      - { icon: "", launch: "wezterm-gui", name: "WezTerm" }
      - { icon: "", launch: "taskmgr", name: "Task Manager" }
      - { icon: "", launch: "start ms-settings:", name: "Settings" }
  power:
    # Opens menubar.exe's power menu (menubar.ini [power]), whose Restart and Shut Down sign back in
    # and lock on the next boot. YASB's own power menu runs plain shutdown /r, which stops at the
    # pre-sign-in screen.
    type: yasb.custom.CustomWidget
    options:
      label: ""
      label_alt: ""
      class_name: power-widget
      tooltip: false
      callbacks:
        on_left: 'exec %USERPROFILE%\.config\yasb\menubar\menubar.exe --menu power'
        on_middle: do_nothing
        on_right: do_nothing
