; Menus for menubar.exe (the one-line app menu on the left of the top bar).
;
; [app:<key>]   name = title shown in bold; menus = menu titles, separated by |
; [<key>.<Menu>] one line per item:  Label = keys | hint   or   Label = @command | hint
;                "- =" is a separator.
; <key> is the exe name without .exe in lower case; "explorer" means File Explorer windows,
; "desktop" the desktop, "*" is added after every app's own menus.
; keys use SendKeys syntax: ^ Ctrl, + Shift, % Alt, then one key or {NAME} (ENTER, DEL, F2, LEFT, ...).
; commands: minimize, maximize, close, start, lock, sleep, restart, shutdown, logoff, open:<target>.
; Right-click the menu bar for Edit menus / Reload menus / Quit.

[system]
About this PC = @open:ms-settings:about
System Settings... = @open:ms-settings:
Task Manager = @open:taskmgr.exe | Ctrl+Shift+Esc
- =
Start menu = @start | Win
- =
Sleep = @sleep
Restart... = @restart
Shut Down... = @shutdown
- =
Lock Screen = @lock | Win+L
Sign Out... = @logoff

[app:*]
menus = Window

[*.Window]
Minimize = @minimize
Maximize = @maximize
- =
App menu bar = {F10} | F10

[app:explorer]
name = File Explorer
menus = File|Edit|View|Go

[explorer.File]
New Window = ^n | Ctrl+N
New Tab = ^t | Ctrl+T
New Folder = ^+n | Ctrl+Shift+N
- =
Properties = %{ENTER} | Alt+Enter
- =
Close Tab = ^w | Ctrl+W

[explorer.Edit]
Undo = ^z | Ctrl+Z
- =
Cut = ^x | Ctrl+X
Copy = ^c | Ctrl+C
Copy as Path = ^+c | Ctrl+Shift+C
Paste = ^v | Ctrl+V
- =
Rename = {F2} | F2
Delete = {DEL} | Del
- =
Select All = ^a | Ctrl+A

[explorer.View]
Extra Large Icons = ^+1 | Ctrl+Shift+1
Large Icons = ^+2 | Ctrl+Shift+2
Medium Icons = ^+3 | Ctrl+Shift+3
Small Icons = ^+4 | Ctrl+Shift+4
List = ^+5 | Ctrl+Shift+5
Details = ^+6 | Ctrl+Shift+6
Tiles = ^+7 | Ctrl+Shift+7
Content = ^+8 | Ctrl+Shift+8
- =
Preview Pane = %p | Alt+P
Details Pane = %+p | Alt+Shift+P
- =
Refresh = {F5} | F5

[explorer.Go]
Back = %{LEFT} | Alt+Left
Forward = %{RIGHT} | Alt+Right
Up One Level = %{UP} | Alt+Up
- =
Address Bar = %d | Alt+D
Search = ^e | Ctrl+E

[app:desktop]
name = Desktop
menus = Edit

[desktop.Edit]
New Folder = ^+n | Ctrl+Shift+N
Paste = ^v | Ctrl+V
Select All = ^a | Ctrl+A
- =
Refresh = {F5} | F5

[app:brave]
name = Brave
menus = File|View|History

[brave.File]
New Tab = ^t | Ctrl+T
New Window = ^n | Ctrl+N
New Private Window = ^+n | Ctrl+Shift+N
Reopen Closed Tab = ^+t | Ctrl+Shift+T
- =
Close Tab = ^w | Ctrl+W

[brave.View]
Find on Page = ^f | Ctrl+F
Reload = ^r | Ctrl+R
Full Screen = {F11} | F11

[brave.History]
Back = %{LEFT} | Alt+Left
Forward = %{RIGHT} | Alt+Right
- =
Show History = ^h | Ctrl+H
Downloads = ^j | Ctrl+J

[app:code - insiders]
name = Code - Insiders
menus = Go|View

[code - insiders.Go]
Command Palette = ^+p | Ctrl+Shift+P
Go to File = ^p | Ctrl+P
Find in Files = ^+f | Ctrl+Shift+F

[code - insiders.View]
Side Bar = ^b | Ctrl+B
Terminal = ^` | Ctrl+`

[app:zed]
name = Zed
menus = Go|View

[zed.Go]
Command Palette = ^+p | Ctrl+Shift+P
Go to File = ^p | Ctrl+P
Find in Project = ^+f | Ctrl+Shift+F

[zed.View]
Project Panel = ^+e | Ctrl+Shift+E
Terminal = ^` | Ctrl+`
